<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fbf9f7;
    --ink: #2a2420;
    --muted: #8b8177;
    --line: #e7e0d8;
    --field: #f4efea;
    --accent: #c24a78;
    --accent-deep: #a73a64;
    --green: #5f8a4e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  .stage { display: flex; min-height: 100vh; }

  /* ---------- Image side ---------- */
  .visual {
    flex: 1 1 50%;
    position: relative;
    overflow: hidden;
    background: #20351f;
  }
  .visual img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: opacity 1.1s ease, transform 1.4s cubic-bezier(.2,.7,.2,1);
  }
  .visual .bloom { opacity: 0; transform: scale(1.12); }
  body.success .visual .bud { opacity: 0; transform: scale(1.06); }
  body.success .visual .bloom { opacity: 1; transform: scale(1); }

  .visual::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(120deg, rgba(20,30,18,.32) 0%, rgba(20,30,18,0) 55%);
    pointer-events: none;
  }
  .brand {
    position: absolute; top: 38px; left: 40px; z-index: 2;
    display: flex; align-items: center; gap: 10px;
    color: #fff;
  }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.85);
    display: grid; place-items: center;
    font-family: 'Fraunces', serif; font-size: 17px; line-height: 1;
  }
  .brand .name {
    font-family: 'Fraunces', serif; font-size: 19px; letter-spacing: .02em;
  }
  .visual .caption {
    position: absolute; left: 40px; bottom: 36px; z-index: 2;
    color: rgba(255,255,255,.92);
    font-family: 'Fraunces', serif; font-size: 26px; line-height: 1.3;
    max-width: 360px;
    text-shadow: 0 1px 14px rgba(0,0,0,.35);
    transition: opacity .6s ease;
  }

  /* ---------- Form side ---------- */
  .panel {
    flex: 1 1 50%;
    display: grid; place-items: center;
    padding: 40px;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(194,74,120,.10) 0%, rgba(194,74,120,0) 50%),
      radial-gradient(110% 80% at 0% 100%, rgba(95,138,78,.10) 0%, rgba(95,138,78,0) 55%),
      linear-gradient(155deg, #fdf9f3 0%, #faf2ef 48%, #f6edf0 100%);
  }
  .card { width: 100%; max-width: 380px; }

  .eyebrow {
    font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin-bottom: 14px;
  }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 500;
    font-size: 38px; line-height: 1.05; letter-spacing: -.01em;
    margin-bottom: 10px;
  }
  .sub { color: var(--muted); font-size: 15px; line-height: 1.5; margin-bottom: 30px; }

  /* SSO */
  .sso { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .sso-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-family: inherit; font-size: 14px; font-weight: 500; color: var(--ink);
    background: rgba(255,255,255,.75);
    border: 1px solid var(--line); border-radius: 11px;
    padding: 12px 14px; cursor: pointer;
    backdrop-filter: blur(4px);
    transition: border-color .18s, background .18s, transform .1s, box-shadow .18s;
  }
  .sso-btn:hover { background: #fff; border-color: #d8cfc5; box-shadow: 0 4px 14px rgba(42,36,32,.06); }
  .sso-btn:active { transform: translateY(1px); }
  .sso-btn svg, .sso-btn img { width: 18px; height: 18px; display: block; }
  .sso-row { display: flex; gap: 10px; }
  .sso-row .sso-btn { flex: 1; }

  .divider {
    display: flex; align-items: center; gap: 14px;
    color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    margin-bottom: 22px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
  }

  form { display: flex; flex-direction: column; gap: 16px; }
  .group { display: flex; flex-direction: column; gap: 7px; }
  label { font-size: 13px; font-weight: 500; color: #4a443e; }
  input {
    font-family: inherit; font-size: 15px; color: var(--ink);
    background: rgba(255,255,255,.62);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 13px 14px;
    transition: border-color .18s, background .18s, box-shadow .18s;
  }
  input::placeholder { color: #b3aaa0; }
  input:focus {
    outline: none; background: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(194,74,120,.12);
  }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
  .remember { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .remember input { width: 15px; height: 15px; accent-color: var(--accent); padding: 0; }
  .link { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 500; }
  .link:hover { text-decoration: underline; }

  button.submit {
    margin-top: 8px;
    font-family: inherit; font-size: 15px; font-weight: 600; color: #fff;
    background: var(--accent);
    border: none; border-radius: 11px;
    padding: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: background .18s, transform .1s;
  }
  button.submit:hover { background: var(--accent-deep); }
  button.submit:active { transform: translateY(1px); }
  button.submit .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
    display: none; animation: spin .7s linear infinite;
  }
  body.loading button.submit .spinner { display: block; }
  body.loading button.submit .label { opacity: .85; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .foot { margin-top: 26px; font-size: 14px; color: var(--muted); text-align: center; }
  .foot a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .foot a:hover { text-decoration: underline; }

  /* ---------- Success state ---------- */
  .success-view {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px;
    opacity: 0; visibility: hidden; transform: translateY(8px);
    transition: opacity .7s ease .15s, transform .7s ease .15s, visibility 0s .9s;
  }
  body.success .card { opacity: 0; visibility: hidden; transition: opacity .35s ease; }
  body.success .success-view { opacity: 1; visibility: visible; transform: none; transition: opacity .7s ease .3s, transform .7s ease .3s; }
  .panel { position: relative; }

  .check {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--green); display: grid; place-items: center;
    margin-bottom: 26px;
    box-shadow: 0 8px 24px rgba(95,138,78,.3);
  }
  .check svg { width: 30px; height: 30px; }
  .check svg path { stroke-dasharray: 30; stroke-dashoffset: 30; }
  body.success .check svg path { animation: draw .5s ease .55s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .success-view h2 {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 34px;
    margin-bottom: 12px; letter-spacing: -.01em;
  }
  .success-view p { color: var(--muted); font-size: 15px; line-height: 1.55; max-width: 320px; margin-bottom: 28px; }
  button.ghost {
    font-family: inherit; font-size: 14px; font-weight: 500; color: var(--accent);
    background: transparent; border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 22px; cursor: pointer; transition: border-color .18s, background .18s;
  }
  button.ghost:hover { border-color: var(--accent); background: #fff; }

  /* ---------- Responsive ---------- */
  @media (max-width: 820px) {
    .stage { flex-direction: column; }
    .visual { flex: 0 0 38vh; min-height: 220px; }
    .visual .caption { font-size: 21px; bottom: 24px; left: 28px; }
    .brand { top: 24px; left: 28px; }
    .panel { padding: 36px 26px 48px; }
    h1 { font-size: 32px; }
  }
</style>

      <div class="brand">
        <div class="mark">B</div>
        <div class="name">Bloom</div>
      </div>
      <div class="caption" id="caption">Every account<br />starts as a bud.</div>
    </section>

    <!-- Form half -->
    <section class="panel" data-screen-label="Sign in">
      <div class="card">
        <div class="eyebrow">Welcome back</div>
        <h1>Sign in to Bloom</h1>
        <p class="sub">Pick up where you left off. Open your garden in one tap.</p>

        <div class="sso">
          <button type="button" class="sso-btn" data-sso="Google">
            <svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
            Continue with Google
          </button>
          <div class="sso-row">
            <button type="button" class="sso-btn" data-sso="Apple" aria-label="Continue with Apple">
              <svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#000" d="M13.6 9.6c-.02-1.84 1.5-2.72 1.57-2.77-.86-1.25-2.19-1.42-2.66-1.44-1.13-.11-2.21.66-2.78.66-.57 0-1.46-.65-2.4-.63-1.23.02-2.37.72-3 1.82-1.28 2.22-.33 5.5.92 7.3.61.88 1.34 1.87 2.3 1.83.92-.04 1.27-.59 2.38-.59 1.11 0 1.42.59 2.4.57 1-.02 1.62-.9 2.23-1.79.7-1.02.99-2.01 1-2.06-.02-.01-1.92-.74-1.94-2.93zM11.8 4.13c.5-.61.84-1.46.75-2.31-.72.03-1.6.48-2.12 1.09-.47.54-.88 1.4-.77 2.23.8.06 1.63-.41 2.14-1.01z"/></svg>
            </button>
            <button type="button" class="sso-btn" data-sso="Facebook" aria-label="Continue with Facebook">
              <svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#1877F2" d="M18 9a9 9 0 1 0-10.4 8.9v-6.3H5.3V9h2.3V7c0-2.27 1.35-3.52 3.42-3.52.99 0 2.02.18 2.02.18v2.22h-1.14c-1.12 0-1.47.7-1.47 1.42V9h2.5l-.4 2.6h-2.1v6.3A9 9 0 0 0 18 9z"/></svg>
            </button>
            <button type="button" class="sso-btn" data-sso="X" aria-label="Continue with X">
              <svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#000" d="M13.9 1.5h2.3l-5 5.73L17.5 16h-4.6l-3.6-4.7L5.1 16H2.8l5.36-6.13L2 1.5h4.7l3.26 4.3 3.94-4.3zm-.8 13.1h1.27L6.0 2.83H4.6l8.5 11.77z"/></svg>
            </button>
          </div>
        </div>

        <div class="divider">or sign in with email</div>

        <form id="form" novalidate>
          <div class="group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <div class="row">
            <label class="remember"><input type="checkbox" /> Remember me</label>
            <a class="link" href="#">Forgot password?</a>
          </div>
          <button class="submit" type="submit">
            <span class="spinner"></span>
            <span class="label">Sign in</span>
          </button>
        </form>
        <p class="foot">New to Bloom? <a href="#">Create an account</a></p>
      </div>

      <!-- Success overlay (lives on the form half) -->
      <div class="success-view">
        <div class="check">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h2>You're in full bloom</h2>
        <p>Signed in successfully. Your garden is ready and waiting for you.</p>
        <button class="ghost" id="reset">Sign out</button>
      </div>
    </section>
  </div>

  <script>
    const form = document.getElementById('form');
    const caption = document.getElementById('caption');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (document.body.classList.contains('loading')) return;
      document.body.classList.add('loading');
      setTimeout(function () {
        document.body.classList.remove('loading');
        document.body.classList.add('success');
        caption.innerHTML = 'And then,<br />it opens.';
      }, 1100);
    });
    document.querySelectorAll('[data-sso]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (document.body.classList.contains('loading')) return;
        document.body.classList.add('loading');
        setTimeout(function () {
          document.body.classList.remove('loading');
          document.body.classList.add('success');
          caption.innerHTML = 'And then,<br />it opens.';
        }, 950);
      });
    });
    document.getElementById('reset').addEventListener('click', function () {
      document.body.classList.remove('success');
      caption.innerHTML = 'Every account<br />starts as a bud.';
      form.reset();
    });
  </script>
</body>
