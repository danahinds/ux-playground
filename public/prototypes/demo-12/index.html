<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMIS · Volunteer Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-canvas:#F5F0E5;
  --bg-card:#FFFFFF;
  --bg-card-alt:#F1EFE8;
  --brand:#085041;
  --brand-deep:#063A2F;
  --brand-tint:#E5EFE9;
  --text-primary:#1A1A1A;
  --text-secondary:#5F5E5A;
  --text-tertiary:#8B8578;
  --text-light:#FBF7EE;
  --border:rgba(26,26,26,0.08);
  --border-strong:rgba(26,26,26,0.18);
  --radius-sm:4px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,0.18);

  --green:#085041;--green-l:#0F6E56;--green-xl:#E3F4EC;--green-b:#2D8653;
  --amber:#F59E0B;--amber-l:#FEF3C7;--amber-b:#B45309;
  --bg:#F0EFEB;--card:#fff;--ink:#111111;--ink-2:#595959;--ink-3:#595959;
  --rule:#E8E8E8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:var(--bg-canvas);color:var(--text-primary);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px 40px;-webkit-font-smoothing:antialiased;}

/* Topbar */
.topbar{width:100%;background:var(--bg-canvas);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;margin-bottom:24px;}
.topbar-inner{max-width:460px;margin:0 auto;padding:14px 0;display:flex;align-items:center;gap:16px;}
.brand-mark{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand-logo{width:32px;height:32px;background:var(--brand);color:var(--text-light);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:"DM Serif Display",Georgia,serif;font-size:16px;}
.brand-text{font-size:14px;font-weight:500;line-height:1.1;color:var(--text-primary);}
.brand-text small{display:block;font-weight:400;color:var(--text-tertiary);font-size:11px;margin-top:2px;}
.topbar-meta{font-size:12px;color:var(--text-tertiary);margin-left:auto;text-align:right;line-height:1.3;}

.phone{width:100%;max-width:380px;min-height:600px;background:var(--bg);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;position:relative;}

/* Common dashboard surface — calmer than the queue apps */
.dash{flex:1;padding:28px 22px 24px;display:flex;flex-direction:column;background:var(--bg-canvas);}

/* Live event stats — shown during in-progress events, replaces yearly stats */
.live-stats{background:#fff;border:1.5px solid var(--rule);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:22px;}
.live-stats-hdr{padding:10px 14px;background:var(--brand-tint);border-bottom:1.5px solid var(--brand-b,var(--rule));display:flex;align-items:center;justify-content:space-between;gap:10px;}
.live-stats-lbl{font-size:11px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.07em;}
.live-pulse{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.08em;}
.live-pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);position:relative;animation:livepulse 1.6s ease-in-out infinite;}
@keyframes livepulse{
  0%,100%{box-shadow:0 0 0 0 rgba(8,80,65,0.4);}
  50%{box-shadow:0 0 0 5px rgba(8,80,65,0);}
}
.live-stats-body{display:flex;}
.live-stats-cell{flex:1;padding:14px 4px 12px;text-align:center;}
.live-stats-cell+.live-stats-cell{border-left:1px solid var(--rule);}
.live-stats-cell-n{font-family:"DM Serif Display",serif;font-size:30px;line-height:1;color:var(--brand);letter-spacing:-.01em;}
.live-stats-cell-lbl{font-size:9px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.07em;margin-top:6px;}

/* Compact info line — replaces the big greeting; gives content the visual weight */
.info-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;}
.info-name{font-family:"DM Serif Display",serif;font-size:18px;color:var(--text-primary);line-height:1;}
.info-name em{font-style:italic;color:var(--brand);}
.info-meta{font-size:11px;color:var(--text-tertiary);font-family:"DM Mono",monospace;text-align:right;line-height:1.3;}

/* Section labels */
.sec-lbl{font-size:10px;font-weight:600;color:var(--text-tertiary);letter-spacing:.09em;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:6px;}
.sec-lbl::after{content:"";flex:1;height:1px;background:var(--border);}

/* Hero card — anchors each state's primary content. Color signals state. */
.hero{border-radius:var(--radius-xl);padding:22px 22px 20px;margin-bottom:20px;position:relative;overflow:hidden;box-shadow:var(--shadow-md);}
.hero-eyebrow{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-family:"DM Mono",monospace;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.hero-eyebrow::before{content:"";width:14px;height:1px;background:currentColor;display:inline-block;opacity:.7;}
.hero-date{font-family:"DM Mono",monospace;font-size:13px;font-weight:500;margin-bottom:6px;letter-spacing:.02em;}
.hero-title{font-family:"DM Serif Display",serif;font-size:28px;line-height:1.05;margin-bottom:8px;letter-spacing:-.005em;}
.hero-sub{font-size:13px;line-height:1.5;margin-bottom:16px;}
.hero-cta{width:100%;height:52px;border:none;border-radius:var(--radius-md);font-size:15px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif;transition:transform .12s,box-shadow .12s;}
.hero-cta:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.14);}
.hero-cta-ghost{width:100%;margin-top:8px;height:42px;background:transparent;border:1px solid currentColor;color:inherit;border-radius:var(--radius-md);font-size:13px;font-weight:500;cursor:pointer;font-family:"DM Sans",sans-serif;opacity:.85;}

/* Hero variants */
.hero-cream{background:#F5EFE0;color:var(--text-primary);}
.hero-cream .hero-eyebrow{color:var(--brand);}
.hero-cream .hero-date{color:var(--text-secondary);}
.hero-cream .hero-sub{color:var(--text-secondary);}
.hero-cream .hero-cta{background:var(--brand);color:#fff;}
.hero-cream .hero-cta:hover{background:var(--brand-deep);}

.hero-green{background:linear-gradient(160deg, var(--brand) 0%, var(--brand-deep) 100%);color:#fff;}
.hero-green .hero-eyebrow{color:#A0DDC8;}
.hero-green .hero-date{color:#C8EEE3;}
.hero-green .hero-sub{color:#E5F4ED;}
.hero-green .hero-cta{background:#fff;color:var(--brand);}
.hero-green .hero-cta:hover{background:#F8F8F8;}

.hero-amber{background:#FCEBC9;color:var(--amber-b);border:1.5px solid #E5C088;}
.hero-amber .hero-eyebrow{color:var(--amber-b);}
.hero-amber .hero-title{color:var(--text-primary);}
.hero-amber .hero-sub{color:var(--text-secondary);}
.hero-amber .hero-cta{background:var(--amber-b);color:#fff;}

/* Decorative corner mark on hero — gives texture, not noise */
.hero-mark{position:absolute;top:18px;right:20px;font-size:48px;line-height:1;opacity:.12;font-family:"DM Serif Display",serif;}

/* Horizontal stats strip — three big numbers across, different orientation than other content */
.stats-strip{display:flex;background:#fff;border:1.5px solid var(--rule);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:22px;}
.stats-cell{flex:1;padding:14px 4px 12px;text-align:center;}
.stats-cell+.stats-cell{border-left:1px solid var(--rule);}
.stats-cell-n{font-family:"DM Serif Display",serif;font-size:30px;line-height:1;color:var(--brand);letter-spacing:-.01em;}
.stats-cell-lbl{font-size:9px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.07em;margin-top:6px;}

/* Compact event rows — calendar-chip pattern */
.evt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.evt-row{background:#fff;border:1.5px solid var(--rule);border-radius:var(--radius-md);padding:10px 12px;display:flex;align-items:center;gap:12px;transition:border-color .12s;}
.evt-row.signed{border-color:var(--brand);background:var(--brand-tint);}
.evt-chip{flex-shrink:0;width:46px;height:46px;border-radius:8px;background:var(--bg-card-alt);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;}
.evt-row.signed .evt-chip{background:var(--brand);color:#fff;}
.evt-chip-mo{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);}
.evt-row.signed .evt-chip-mo{color:#C8EEE3;}
.evt-chip-d{font-family:"DM Serif Display",serif;font-size:20px;color:var(--text-primary);margin-top:2px;}
.evt-row.signed .evt-chip-d{color:#fff;}
.evt-rest{flex:1;min-width:0;}
.evt-rest-name{font-size:13px;font-weight:500;color:var(--text-primary);line-height:1.25;}
.evt-rest-meta{font-size:10px;color:var(--text-tertiary);margin-top:2px;font-family:"DM Mono",monospace;letter-spacing:.02em;}
.evt-pill{flex-shrink:0;height:30px;padding:0 12px;background:transparent;border:1px solid var(--brand);color:var(--brand);border-radius:999px;font-size:11px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif;display:flex;align-items:center;gap:4px;transition:all .12s;}
.evt-pill:hover{background:var(--brand);color:#fff;}
.evt-pill.signed{background:var(--brand);color:#fff;}

/* Demo state toggle — quiet utility, lives in dash-footer */
.demo-state-link{background:transparent;border:none;color:var(--text-tertiary);font-size:11px;font-style:italic;cursor:pointer;font-family:"DM Sans",sans-serif;align-self:center;text-decoration:underline;padding:4px 8px;}
.demo-state-link:hover{color:var(--text-secondary);}

/* Demo controls — for checked_in only */
.demo-section{margin-top:18px;padding-top:14px;border-top:1px dashed var(--rule);}
.demo-lbl{font-size:10px;color:var(--text-tertiary);font-style:italic;text-align:center;margin-bottom:8px;letter-spacing:.04em;}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.demo-btn{height:36px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--radius-md);font-size:12px;font-weight:500;color:var(--text-secondary);cursor:pointer;font-family:"DM Sans",sans-serif;}
.demo-btn:hover{background:var(--bg-card-alt);color:var(--text-primary);}

/* Footer area at bottom of dashboard */
.dash-footer{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;align-items:center;gap:4px;}

/* Sign out — quiet utility */
.sign-out{background:transparent;border:none;color:var(--text-tertiary);font-size:12px;cursor:pointer;font-family:"DM Sans",sans-serif;text-decoration:underline;padding:4px 8px;}
.sign-out:hover{color:var(--text-secondary);}

/* Login overlay */
.login{position:absolute;inset:0;background:var(--bg-canvas);padding:36px 22px 28px;display:flex;flex-direction:column;}
.login-eyebrow{font-size:11px;font-weight:500;color:var(--text-tertiary);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;font-family:"DM Mono",monospace;}
.login-h{font-family:"DM Serif Display",serif;font-size:26px;line-height:1.15;margin-bottom:6px;}
.login-h em{font-style:italic;color:var(--brand);}
.login-sub{font-size:13px;color:var(--text-secondary);line-height:1.4;margin-bottom:24px;}
.login-form{display:flex;flex-direction:column;flex:1;}
.login-label{font-size:12px;font-weight:600;color:var(--text-secondary);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px;display:block;}
.login-input{width:100%;height:46px;padding:0 14px;border:1.5px solid var(--rule);border-radius:var(--radius-md);background:#fff;font-size:15px;font-family:"DM Sans",sans-serif;color:var(--text-primary);outline:none;transition:border-color .15s;}
.login-input:focus{border-color:var(--brand);}
.login-hint{font-size:11px;color:var(--text-tertiary);margin-top:6px;line-height:1.4;}
.login-spacer{flex:1;min-height:24px;}
.login-cta{width:100%;height:50px;background:var(--brand);color:#fff;border:none;border-radius:var(--radius-md);font-size:15px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif;transition:background .15s;}
.login-cta:hover{background:var(--brand-deep);}
.login-cta:disabled{background:#D8D8D8;cursor:not-allowed;}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;}
.anim{animation:si .25s ease;}
@keyframes si{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-mark">
      <div class="brand-logo">S</div>
      <div class="brand-text">Volunteer dashboard<small>HMIS &middot; Pinellas Hope</small></div>
    </div>
    <div class="topbar-meta">Friday, May 1<br>6:42 AM</div>
  </div>
</header>

<div class="phone" id="phone-wrap">
  <div id="dash"></div>
  <div id="login-overlay"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Volunteer dashboard prototype
   States the dashboard moves through:
     1. login (overlay) — sign in
     2. no_event   — calm view, just upcoming events
     3. event_open — event today, scheduled but not started
     4. event_live — event currently in progress, live stats
     5. checked_in — flagged on-site, waiting for leader assignment
     6. assigned   — station decided, can open station app
   "Find a leader" is human-mediated; the demo simulates that
   handoff via small station picker.
   ============================================================ */

// ---- State ----
var state = "login";
var volunteerName = "";
var assignedStation = null; // "shower" | "barber" | "fulfillment" | "pickup"
var checkInTime = null;
var nameDraft = "";  // legacy var name kept for minimal diff; now holds email or phone
var signedUpEvents = []; // indices into UPCOMING that volunteer committed to

// Mock event data — date fields broken out for chip rendering
var TODAYS_EVENT = {
  time: "7:00 AM",
  urgent: "starts in 18 min",
  startedAgo: "started 22 min ago",
  name: "Pinellas Hope shower morning",
  loc: "Pinellas Hope campus &middot; main shelter"
};
// Today's event live progress (mock — would update from queue apps in production)
var TODAYS_PROGRESS = {
  showers: 12,
  haircuts: 8,
  clothing: 18,
  waiting: 6
};
var UPCOMING = [
  { mo:"MAY", d:"9",  dow:"SAT", time:"8:00 AM", name:"Mobile clinic + clothing distribution", loc:"Mt. Pleasant lot" },
  { mo:"MAY", d:"13", dow:"WED", time:"6:00 PM", name:"Evening meal service",                  loc:"St. Vincent kitchen" },
  { mo:"MAY", d:"15", dow:"FRI", time:"7:00 AM", name:"Pinellas Hope shower morning",          loc:"Pinellas Hope campus" }
];

var STATION_LABELS = {
  shower: "Shower",
  barber: "Barber",
  fulfillment: "Fulfillment",
  pickup: "Pickup"
};
var STATION_FILES = {
  shower: "Shower_Queue_Test.html",
  barber: "hmis_barber_queue.html",
  fulfillment: "hmis_fulfillment_queue.html",
  pickup: "hmis_pickup_queue.html"
};

// ---- Actions ----
function isValidId(v){
  v = (v||"").trim();
  if(v.length < 4) return false;
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return true;       // email
  var digits = v.replace(/\D/g,"");
  return digits.length >= 7;                                    // phone
}
function deriveDisplayName(v){
  v = (v||"").trim();
  if(v.indexOf("@") > 0){
    var local = v.split("@")[0].split(/[._-]/)[0];
    return local.charAt(0).toUpperCase() + local.slice(1);
  }
  return "Tasha"; // demo default for phone — Clerk would return real name
}
function handleNameInput(v){
  nameDraft = v;
  var btn = document.getElementById("login-cta");
  if(btn) btn.disabled = !isValidId(nameDraft);
}
function submitLogin(e){
  if(e) e.preventDefault();
  if(!isValidId(nameDraft)) return;
  volunteerName = deriveDisplayName(nameDraft);
  // For demo: route into no-event view by default so reviewer sees the
  // upcoming-events sign-up flow first. Demo link at the bottom flips to event_open.
  state = "no_event";
  render();
}
function checkIn(){
  checkInTime = new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  state = "checked_in";
  render();
}
function simulateAssignment(station){
  assignedStation = station;
  state = "assigned";
  showToast("A leader assigned you to " + STATION_LABELS[station]);
  render();
}
function openStation(){
  if(!assignedStation) return;
  // In production this would route within the same app; for prototype we navigate
  window.location.href = STATION_FILES[assignedStation];
}
function signOut(){
  state = "login";
  volunteerName = "";
  assignedStation = null;
  checkInTime = null;
  nameDraft = "";
  signedUpEvents = [];
  render();
}

function toggleSignUp(idx){
  var i = signedUpEvents.indexOf(idx);
  if(i >= 0){
    signedUpEvents.splice(i, 1);
    showToast("Removed signup for " + UPCOMING[idx].name);
  } else {
    signedUpEvents.push(idx);
    showToast("You're signed up &mdash; thank you!");
  }
  render();
}

// Demo state cycler — small affordance so reviewers can see all views
function setDemoState(s){
  if(s === "login"){ signOut(); return; }
  if(!volunteerName) volunteerName = "Tasha";
  state = s;
  if(s === "no_event"){ assignedStation = null; checkInTime = null; }
  if(s === "event_open"){ assignedStation = null; checkInTime = null; }
  if(s === "event_live"){ assignedStation = null; checkInTime = null; }
  if(s === "checked_in"){ checkInTime = checkInTime || new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}); assignedStation = null; }
  if(s === "assigned"){
    checkInTime = checkInTime || new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    assignedStation = assignedStation || "pickup";
  }
  render();
}

function showToast(msg){
  var t = document.getElementById("toast");
  t.innerHTML = msg;
  t.classList.add("show");
  setTimeout(function(){t.classList.remove("show");}, 2400);
}

function getGreetingTime(){
  var h = new Date().getHours();
  if(h < 12) return "Good morning";
  if(h < 17) return "Good afternoon";
  return "Good evening";
}
function firstName(n){return (n||"").split(" ")[0];}

// Org impact stats — horizontal strip, three big numbers
function renderStats(){
  var s = "";
  s += "<div class='sec-lbl'>This year, together</div>";
  s += "<div class='stats-strip'>";
  s += "<div class='stats-cell'><div class='stats-cell-n'>45</div><div class='stats-cell-lbl'>Showers</div></div>";
  s += "<div class='stats-cell'><div class='stats-cell-n'>85</div><div class='stats-cell-lbl'>Haircuts</div></div>";
  s += "<div class='stats-cell'><div class='stats-cell-n'>127</div><div class='stats-cell-lbl'>Clothing</div></div>";
  s += "</div>";
  return s;
}

// Today's event live stats — what's been done at the event in progress
function renderLiveStats(){
  var s = "";
  s += "<div class='live-stats'>";
  s += "<div class='live-stats-hdr'>";
  s += "<div class='live-stats-lbl'>Today so far</div>";
  s += "<div class='live-pulse'><span class='live-pulse-dot'></span>Live</div>";
  s += "</div>";
  s += "<div class='live-stats-body'>";
  s += "<div class='live-stats-cell'><div class='live-stats-cell-n'>" + TODAYS_PROGRESS.showers + "</div><div class='live-stats-cell-lbl'>Showers</div></div>";
  s += "<div class='live-stats-cell'><div class='live-stats-cell-n'>" + TODAYS_PROGRESS.haircuts + "</div><div class='live-stats-cell-lbl'>Haircuts</div></div>";
  s += "<div class='live-stats-cell'><div class='live-stats-cell-n'>" + TODAYS_PROGRESS.clothing + "</div><div class='live-stats-cell-lbl'>Clothing</div></div>";
  s += "</div>";
  s += "</div>";
  return s;
}

// Compact info line — quiet greeting that doesn't dominate
function renderInfoLine(){
  var d = new Date();
  var dateStr = d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  var timeStr = d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  var s = "<div class='info-line'>";
  s += "<div class='info-name'>Hi, <em>" + firstName(volunteerName) + "</em></div>";
  s += "<div class='info-meta'>" + dateStr + "<br>" + timeStr + "</div>";
  s += "</div>";
  return s;
}

// Compact event row with date chip
function renderEventRow(idx){
  var e = UPCOMING[idx];
  var signed = signedUpEvents.indexOf(idx) >= 0;
  var s = "<div class='evt-row" + (signed?" signed":"") + "'>";
  s += "<div class='evt-chip'><div class='evt-chip-mo'>" + e.mo + "</div><div class='evt-chip-d'>" + e.d + "</div></div>";
  s += "<div class='evt-rest'>";
  s += "<div class='evt-rest-name'>" + e.name + "</div>";
  s += "<div class='evt-rest-meta'>" + e.dow + " &middot; " + e.time + "</div>";
  s += "</div>";
  s += "<button class='evt-pill" + (signed?" signed":"") + "' onclick='toggleSignUp(" + idx + ")'>" +
       (signed ? "&#10003; Signed" : "Sign up") + "</button>";
  s += "</div>";
  return s;
}

// ---- Render ----
function render(){
  var loginOv = document.getElementById("login-overlay");
  var dash = document.getElementById("dash");

  if(state === "login"){
    loginOv.style.display = "flex";
    renderLogin();
    dash.innerHTML = "";
    return;
  }

  loginOv.style.display = "none";
  loginOv.innerHTML = "";

  var h = "<div class='dash anim'>";
  h += renderInfoLine();

  if(state === "no_event"){
    // Hero — feature the soonest upcoming event
    var nextE = UPCOMING[0];
    var nextSigned = signedUpEvents.indexOf(0) >= 0;
    h += "<div class='hero hero-cream'>";
    h += "<div class='hero-mark'>&#9728;</div>";
    h += "<div class='hero-eyebrow'>Next event</div>";
    h += "<div class='hero-date'>" + nextE.dow + ", " + nextE.mo + " " + nextE.d + " &middot; " + nextE.time + "</div>";
    h += "<div class='hero-title'>" + nextE.name + "</div>";
    h += "<div class='hero-sub'>" + nextE.loc + "</div>";
    h += "<button class='hero-cta' onclick='toggleSignUp(0)'>" +
         (nextSigned ? "&#10003; You're signed up" : "I'll be there") + "</button>";
    h += "</div>";

    h += renderStats();

    if(UPCOMING.length > 1){
      h += "<div class='sec-lbl'>Also coming up</div>";
      h += "<div class='evt-list'>";
      for(var i = 1; i < UPCOMING.length; i++) h += renderEventRow(i);
      h += "</div>";
    }

    h += "<div class='dash-footer'>";
    h += "<button class='demo-state-link' onclick='setDemoState(\"event_open\")'>Demo &middot; simulate an event today</button>";
    h += "<button class='demo-state-link' onclick='setDemoState(\"event_live\")'>Demo &middot; simulate a live event</button>";
    h += "<button class='sign-out' onclick='signOut()'>Sign out</button>";
    h += "</div>";
  }

  else if(state === "event_open"){
    // Hero — today's event with the I'm here button right inside
    h += "<div class='hero hero-green'>";
    h += "<div class='hero-mark'>&#9728;</div>";
    h += "<div class='hero-eyebrow'>Today &middot; " + TODAYS_EVENT.urgent + "</div>";
    h += "<div class='hero-date'>" + TODAYS_EVENT.time + "</div>";
    h += "<div class='hero-title'>" + TODAYS_EVENT.name + "</div>";
    h += "<div class='hero-sub'>" + TODAYS_EVENT.loc + "</div>";
    h += "<button class='hero-cta' onclick='checkIn()'>I'm here</button>";
    h += "</div>";

    h += renderStats();

    h += "<div class='sec-lbl'>Coming up next</div>";
    h += "<div class='evt-list'>";
    for(var i = 0; i < Math.min(2, UPCOMING.length); i++) h += renderEventRow(i);
    h += "</div>";

    h += "<div class='dash-footer'>";
    h += "<button class='demo-state-link' onclick='setDemoState(\"event_live\")'>Demo &middot; event has started, see live view</button>";
    h += "<button class='demo-state-link' onclick='setDemoState(\"no_event\")'>Demo &middot; simulate no event today</button>";
    h += "<button class='sign-out' onclick='signOut()'>Sign out</button>";
    h += "</div>";
  }

  else if(state === "event_live"){
    // Hero — event currently in progress, momentum-focused
    h += "<div class='hero hero-green'>";
    h += "<div class='hero-mark'>&#9728;</div>";
    h += "<div class='hero-eyebrow'><span class='live-pulse-dot' style='display:inline-block;background:#A0DDC8;margin-right:6px;'></span>Live now &middot; " + TODAYS_EVENT.startedAgo + "</div>";
    h += "<div class='hero-date'>" + TODAYS_EVENT.time + " &middot; " + TODAYS_PROGRESS.waiting + " people waiting</div>";
    h += "<div class='hero-title'>" + TODAYS_EVENT.name + "</div>";
    h += "<div class='hero-sub'>" + TODAYS_EVENT.loc + "</div>";
    h += "<button class='hero-cta' onclick='checkIn()'>I'm here</button>";
    h += "</div>";

    h += renderLiveStats();

    h += "<div class='sec-lbl'>Coming up next</div>";
    h += "<div class='evt-list'>";
    for(var i = 0; i < Math.min(2, UPCOMING.length); i++) h += renderEventRow(i);
    h += "</div>";

    h += "<div class='dash-footer'>";
    h += "<button class='demo-state-link' onclick='setDemoState(\"event_open\")'>Demo &middot; back to pre-event</button>";
    h += "<button class='demo-state-link' onclick='setDemoState(\"no_event\")'>Demo &middot; simulate no event today</button>";
    h += "<button class='sign-out' onclick='signOut()'>Sign out</button>";
    h += "</div>";
  }

  else if(state === "checked_in"){
    // Hero — amber, "find a leader" with check-in confirmation in eyebrow
    h += "<div class='hero hero-amber'>";
    h += "<div class='hero-mark'>&#128075;</div>";
    h += "<div class='hero-eyebrow'>&#10003; Checked in &middot; " + checkInTime + "</div>";
    h += "<div class='hero-title'>Find a station leader</div>";
    h += "<div class='hero-sub'>They&rsquo;ll point you where you&rsquo;re needed most this morning &mdash; shower, barber, fulfillment, or pickup. Thank you for being here.</div>";
    h += "</div>";

    h += renderLiveStats();

    h += "<div class='demo-section'>";
    h += "<div class='demo-lbl'>Demo &middot; simulate a leader assigning you</div>";
    h += "<div class='demo-grid'>";
    h += "<button class='demo-btn' onclick='simulateAssignment(\"shower\")'>Shower</button>";
    h += "<button class='demo-btn' onclick='simulateAssignment(\"barber\")'>Barber</button>";
    h += "<button class='demo-btn' onclick='simulateAssignment(\"fulfillment\")'>Fulfillment</button>";
    h += "<button class='demo-btn' onclick='simulateAssignment(\"pickup\")'>Pickup</button>";
    h += "</div>";
    h += "</div>";

    h += "<div class='dash-footer'>";
    h += "<button class='sign-out' onclick='signOut()'>Sign out</button>";
    h += "</div>";
  }

  else if(state === "assigned"){
    // Hero — deep green station card
    h += "<div class='hero hero-green'>";
    h += "<div class='hero-mark'>&#10003;</div>";
    h += "<div class='hero-eyebrow'>Your station today</div>";
    h += "<div class='hero-title' style='font-size:40px;letter-spacing:-.01em;'>" + STATION_LABELS[assignedStation] + "</div>";
    h += "<div class='hero-sub'>Checked in " + checkInTime + " &middot; " + TODAYS_EVENT.name + ". Head over whenever you&rsquo;re ready.</div>";
    h += "<button class='hero-cta' onclick='openStation()'>Open " + STATION_LABELS[assignedStation] + " &rarr;</button>";
    h += "</div>";

    h += renderLiveStats();

    h += "<div class='dash-footer'>";
    h += "<div style='font-size:11px;color:var(--text-tertiary);text-align:center;line-height:1.45;margin-bottom:6px;'>Need to switch stations? Talk to your leader.</div>";
    h += "<button class='sign-out' onclick='signOut()'>Sign out</button>";
    h += "</div>";
  }

  h += "</div>";

  dash.innerHTML = h;
}

function renderLogin(){
  var loginOv = document.getElementById("login-overlay");
  var canSubmit = isValidId(nameDraft);
  var h = "";
  h += "<div class='login'>";
  h += "<div class='login-eyebrow'>HMIS &middot; Pinellas Hope</div>";
  h += "<div class='login-h'>" + getGreetingTime() + ".</div>";
  h += "<div class='login-sub'>Sign in with your email or phone to continue.</div>";
  h += "<form class='login-form' onsubmit='submitLogin(event)'>";
  h += "<label class='login-label' for='id-inp'>Email or phone</label>";
  h += "<input id='id-inp' class='login-input' type='text' inputmode='email' autocomplete='username' autocapitalize='off' spellcheck='false' placeholder='you@example.com or (555) 123-4567' value='" + (nameDraft||"") + "' oninput='handleNameInput(this.value)'>";
  h += "<div class='login-hint'>We&rsquo;ll send a code to verify it&rsquo;s you.</div>";
  h += "<div class='login-spacer'></div>";
  h += "<button id='login-cta' class='login-cta' type='button' onclick='submitLogin()' " + (canSubmit?"":"disabled") + ">Continue</button>";
  h += "</form>";
  h += "</div>";
  loginOv.innerHTML = h;
  setTimeout(function(){
    var inp = document.getElementById("id-inp");
    if(inp && !nameDraft) inp.focus();
  }, 50);
}

render();
</script>
</body>
</html>
